<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Anivora</title>
		<meta
			name="description"
			content="Anivora — streaming anime fanmade, doujin, dan kreator lokal."
		/>
		<script>
			(()=> {try{var stored=window.localStorage.getItem('theme');var mode=(stored==='light'||stored==='dark'||stored==='auto')?stored:'auto';var prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;var resolved=mode==='auto'?(prefersDark?'dark':'light'):mode;var root=document.documentElement;root.classList.remove('light','dark');root.classList.add(resolved);if(mode==='auto'){root.removeAttribute('data-theme')}else{root.setAttribute('data-theme',mode)}root.style.colorScheme=resolved;}catch(e){}})();
		</script>
		<script>
			/* Diagnostic: surface fatal load errors on devices without devtools (smart TVs). */
			(function () {
				function show(label, detail) {
					var r = document.getElementById('root');
					if (!r || r.hasChildNodes()) return;
					r.innerHTML =
						'<pre style="color:#fff;background:#111;padding:16px;margin:0;white-space:pre-wrap;word-break:break-word;font:13px/1.4 monospace">[' +
						label + '] ' + detail + '</pre>';
				}
				window.addEventListener('error', function (e) {
					show('JS', (e.message || (e.error && e.error.message) || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
				});
				window.addEventListener('unhandledrejection', function (e) {
					var r = e.reason;
					show('PROMISE', (r && (r.stack || r.message)) || String(r));
				});
			})();
		</script>
	</head>
	<body class="font-sans antialiased [overflow-wrap:anywhere] selection:bg-[rgba(226,54,54,0.32)]">
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
